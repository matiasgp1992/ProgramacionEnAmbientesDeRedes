<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>esp15VentanaModal</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<div id="contenedor" class="contenedorActivo">
		<h1>Esto es el div contenedor</h1>

		<div class="centrado">
			<button id="btAbrirModal">Abrir modal</button>
		</div>
	</div>

	<div id="ventanaModal" class="ventanaModalApagado">
		<div id="cajaModal">
			<header>
				<h1>Formulario para ALTA</h1>
				<h2>Contrato de Crédito</h2>
			</header>

			<form id="formContrato">
				<div class="campo">
					<label for="idContrato">Id_Contrato:</label>
					<input type="text" id="idContrato" name="idContrato" required>
				</div>

				<div class="campo">
					<label for="selectPlanDePago">PlanDePago:</label>
					<select id="selectPlanDePago" name="selectPlanDePago" required>
					</select>
				</div>

				<div class="campo">
					<label for="dniDeudor">DNI_Deudor:</label>
					<input type="text" id="dniDeudor" name="dniDeudor" required>
				</div>

				<div class="campo">
					<label for="fechaContrato">FechaContrato:</label>
					<input type="date" id="fechaContrato" name="fechaContrato" required>
				</div>

				<div class="campo">
					<label for="apellidoNombres">Apellido_Nombres:</label>
					<input type="text" id="apellidoNombres" name="apellidoNombres" required>
				</div>

				<div class="campo">
					<label for="montoTotalFinanciado">Monto_total_financiado:</label>
					<input type="number" id="montoTotalFinanciado" name="montoTotalFinanciado" step="0.01" required>
				</div>

				<div class="campo botonesModal">
					<button type="submit">ENVIAR</button>
					<button type="button" id="btCerrarModal">CANCELAR</button>
				</div>
			</form>
		</div>
	</div>

	<footer>
		<p>Matias Gomez Paratcha</p>
	</footer>

	<script src="../jquery.js"></script>
	<script src="planDePago.js"></script>
	<script src="script.js"></script>
</body>
</html>
