<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>js04_2_operaciones_entre_inputs</title>
</head>
<body>

	<header>
		<h1>Introducir un valor en los cuadros de texto y luego pulsar el boton para ejecutar la función correspondiente.</h1>
	</header>

	<main>
		<table>
			<tr>
				<td>Entrada 1:</td>
				<td><input type="text" id="entrada1" value="0"></td>
			</tr>
			<tr>
				<td>Entrada 2:</td>
				<td><input type="text" id="entrada2" value="0"></td>
			</tr>
			<tr>
				<td>Entrada 3:</td>
				<td><input type="text" id="entrada3" value="0"></td>
			</tr>
			<tr>
				<td>Resultado:</td>
				<td><input type="text" id="resultado" value="0" readonly></td>
			</tr>
		</table>

		<button id="btnSuma">Suma</button>
		<button id="btnPromedio">Promedio</button>
		<button id="btnMayor">Mayor</button>
	</main>

	<script src="script.js"></script>
</body>
</html>
