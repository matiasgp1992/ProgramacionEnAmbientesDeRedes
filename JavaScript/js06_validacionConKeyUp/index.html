<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>js06_validacionConKeyUp</title>
	<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

	<header>
		<h1>Ejer validación de un INPUT de formulario en el evento de onKeyUp</h1>
	</header>

	<main>
		<form id="miFormulario">
			<label for="dia">Ingrese el día del mes (1 a 31):</label>
			<input type="number" id="dia" name="dia" min="1" max="31" step="1" required>

			<label for="mes">Ingrese el mes (1 a 12):</label>
			<input type="number" id="mes" name="mes" min="1" max="12" step="1" required>

			<button type="button" id="btnEnviar">Enviar</button>
			<button type="button" id="btnReset">Reset</button>
		</form>
	</main>

	<script src="script.js?v=2"></script>
</body>
</html>
