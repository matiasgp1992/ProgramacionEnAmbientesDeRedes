<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>css02SelectoresDeClase</title>
    <style>
        #tituloAuto {
            color: #c0392b;
            text-align: center;
        }

        #imagenAuto {
            display: block;
            margin: 0 auto;
            width: 300px;
        }

        .caracteristica {
            background-color: #f0f0f0;
            border-left: 4px solid #c0392b;
            padding: 8px;
            margin: 6px 0;
        }
    </style>
</head>
<body>
    <h1>Selectores de Clase</h1>

    <h2 id="tituloAuto">Toyota Corolla</h2>
    <img id="imagenAuto" src="auto.avif" alt="Toyota Corolla">

    <p class="caracteristica">Motor 1.8L con 140 caballos de fuerza.</p>
    <p class="caracteristica">Transmisión automática CVT.</p>
    <p class="caracteristica">Consumo aproximado de 18 km por litro.</p>
</body>
</html>
