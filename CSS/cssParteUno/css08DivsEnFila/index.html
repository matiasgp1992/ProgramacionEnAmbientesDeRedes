<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>css08DivsEnFila</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            padding: 20px;
        }

        .contenedor {
            display: flex;
            gap: 20px;
            padding: 0 20px;
        }

        .caja {
            width: 200px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        #div1 {
            background-color: #d9d9d9;
        }

        #div2 {
            background-color: #f4c542;
        }

        #div3 {
            padding: 0;
            overflow: hidden;
        }

        #div3 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #div4 {
            background-color: #6fa8dc;
            color: white;
        }

        @media (max-width: 700px) {
            .contenedor {
                flex-direction: column;
            }

            .caja {
                width: 80%;
                margin: 0 auto;
                padding: 12px;
                font-size: 14px;
            }

            h1 {
                font-size: 22px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <h1>Cajas en Fila</h1>

    <div class="contenedor">
        <div id="div1" class="caja">
            <p>Este es el primer div, ubicado a la izquierda.</p>
        </div>

        <div id="div2" class="caja">
            <p>Este es el segundo div, ubicado al lado del primero.</p>
        </div>

        <div id="div3" class="caja">
            <img src="futbolista.jpg" alt="Futbolista">
        </div>

        <div id="div4" class="caja">
            <p>Este es el cuarto div, ubicado al final de la fila.</p>
        </div>
    </div>
</body>
</html>
