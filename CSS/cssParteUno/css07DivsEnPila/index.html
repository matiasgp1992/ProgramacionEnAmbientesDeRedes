<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>css07DivsEnPila</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            padding: 20px;
        }

        .caja {
            width: 500px;
            margin: 0 auto 20px auto;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        @media (max-width: 600px) {
            .caja {
                width: 80%;
                padding: 12px;
                font-size: 14px;
            }

            h1 {
                font-size: 22px;
                padding: 12px;
            }
        }

        @media (max-width: 400px) {
            .caja {
                width: 90%;
                padding: 8px;
                font-size: 12px;
            }

            h1 {
                font-size: 18px;
                padding: 8px;
            }
        }

        #div1 {
            background-color: #d9d9d9;
        }

        #div2 {
            background-color: #f4c542;
        }

        #div3 {
            padding: 0;
            overflow: hidden;
        }

        #div3 img {
            width: 100%;
            display: block;
        }

        #div4 {
            background-color: #6fa8dc;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Cajas en Pila</h1>

    <div id="div1" class="caja">
        <p>Este es el primer div, apilado en la parte superior.</p>
    </div>

    <div id="div2" class="caja">
        <p>Este es el segundo div, apilado justo debajo del primero.</p>
    </div>

    <div id="div3" class="caja">
        <img src="futbolista.jpg" alt="Futbolista">
    </div>

    <div id="div4" class="caja">
        <p>Este es el cuarto div, ubicado debajo de la imagen del futbolista.</p>
    </div>
</body>
</html>
